<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odesa · Shutdowns</title>
<meta name="description" content="Today's power outage schedule for Odesa (DTEK) — current status and on/off timeline for your queue.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shutdowns">
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --card-soft:#f2f2f7; --sep:#e5e5ea;
    --text:#1c1c1e; --muted:#8e8e93;
    --on:#34c759; --off:#ff3b30; --maybe:#ff9500; --unkn:#d1d1d6;
    --accent:#007aff; --now:#1c1c1e; --header-bg:rgba(242,242,247,.82);
    --err-bg:rgba(255,59,48,.09); --err-ink:#d70015;
    --warn-bg:rgba(255,149,0,.12); --warn-ink:#a04d00;
    --attn-bg:rgba(255,59,48,.09); --attn-ink:#d70015;
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e; --card-soft:#2c2c2e; --sep:#38383a;
    --text:#f5f5f7; --muted:#98989d;
    --on:#30d158; --off:#ff453a; --maybe:#ff9f0a; --unkn:#48484a;
    --accent:#0a84ff; --now:#f5f5f7; --header-bg:rgba(18,18,20,.78);
    --err-bg:rgba(255,69,58,.14); --err-ink:#ff8a80;
    --warn-bg:rgba(255,159,10,.14); --warn-ink:#ffb340;
    --attn-bg:rgba(255,69,58,.14); --attn-ink:#ff8a80;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --card:#1c1c1e; --card-soft:#2c2c2e; --sep:#38383a;
      --text:#f5f5f7; --muted:#98989d;
      --on:#30d158; --off:#ff453a; --maybe:#ff9f0a; --unkn:#48484a;
      --accent:#0a84ff; --now:#f5f5f7; --header-bg:rgba(18,18,20,.78);
      --err-bg:rgba(255,69,58,.14); --err-ink:#ff8a80;
      --warn-bg:rgba(255,159,10,.14); --warn-ink:#ffb340;
      --attn-bg:rgba(255,69,58,.14); --attn-ink:#ff8a80;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
  header{position:sticky;top:0;z-index:40;margin:0 -16px 20px;padding:12px 16px 10px;
         background:var(--header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
         border-bottom:1px solid var(--sep)}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hbtns{display:flex;gap:8px}
  .hmeta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;margin-top:6px}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px}
  /* hero: state pill + next switch + countdown */
  .state{display:inline-flex;align-items:center;gap:10px;font-size:clamp(22px,5.5vw,30px);font-weight:700;
         letter-spacing:.3px;line-height:1.15;padding:7px 18px;border-radius:999px;color:#fff}
  .state::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9)}
  .state.on{background:var(--on)} .state.off{background:var(--off)}
  .state.maybe{background:var(--maybe)} .state.unknown{background:var(--muted)}
  .nextsw{font-size:15px;margin-top:12px}
  .nextsw:empty{display:none}
  .cd{font-size:clamp(30px,8vw,38px);font-weight:700;margin-top:10px;color:var(--accent);
      font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.15}
  .cd:empty{display:none}
  .cd.urgent{color:var(--off)}
  .cdlabel{font-size:14px;color:var(--muted);margin-top:2px}
  .cdlabel:empty{display:none}
  .hr{border:0;border-top:1px solid var(--sep);margin:18px 0 16px}
  /* section header */
  h2{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--muted);
     text-transform:uppercase;letter-spacing:.06em}
  h2.h2big{font-size:17px;font-weight:700;color:var(--text);text-transform:none;letter-spacing:-.2px}
  .src{font-weight:500;color:var(--muted);font-size:13px;text-transform:none;letter-spacing:0}
  /* banners */
  .banner{border-radius:16px;padding:12px 15px;margin-bottom:12px;font-size:14px}
  .banner.err{background:var(--err-bg);color:var(--err-ink)}
  .banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
  .banner.attn{background:var(--attn-bg);color:var(--attn-ink)}
  .attn-body{white-space:pre-line;margin-top:6px;font-size:15px}
  /* controls */
  button{background:var(--accent);color:#fff;border:0;border-radius:12px;
         padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s ease}
  button:hover{opacity:.85}
  button.secondary{background:var(--card-soft);color:var(--text)}
  button.secondary:hover{opacity:.7}
  button:disabled{opacity:.4;cursor:wait}
  .iconbtn{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;
           font-size:17px;line-height:1;border-radius:50%}
  .queuebtn{background:var(--card-soft);color:var(--text);border-radius:999px;
            padding:5px 13px;font-size:13px;font-weight:600}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .muted{color:var(--muted)} .small{font-size:13px}
  /* --- timeline bar --- */
  .barwrap{position:relative;margin-top:30px}
  .bar{display:flex;height:46px;border-radius:12px;overflow:hidden;border:1px solid var(--sep);position:relative}
  .seg{position:relative;height:100%}
  .seg span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:11px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.5px;
            text-shadow:0 1px 1px rgba(0,0,0,.2)}
  .grid{position:absolute;inset:0;pointer-events:none;z-index:2}
  .gline{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.5)}
  .gline.half{background:rgba(255,255,255,.2)}
  .nowline{position:absolute;top:-7px;bottom:-2px;width:2px;background:var(--now);z-index:3;border-radius:2px}
  .nowlabel{position:absolute;top:-28px;transform:translateX(-50%);font-size:11px;font-weight:600;
            background:var(--now);color:var(--bg);border-radius:6px;padding:2px 7px;z-index:4;white-space:nowrap}
  .ruler{position:relative;height:15px;margin-top:6px}
  .tick{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(-50%);
        font-variant-numeric:tabular-nums}
  /* --- windows list --- */
  .wins{list-style:none;margin:10px 0 0;padding:0}
  .wins li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--sep)}
  .wins li:last-child{border-bottom:0}
  .wins .mark{flex:none;font-size:10px;font-weight:700;letter-spacing:.5px;border-radius:999px;padding:3px 9px;color:#fff}
  .wins .t{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
  .wins .dur{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
  .totals{margin-top:12px;font-size:13px;color:var(--muted)}
  .totals b{color:var(--text)}
  /* --- queue picker --- */
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
  .qcard{background:var(--card-soft);border:1px solid transparent;border-radius:14px;
         padding:12px 14px;cursor:pointer;text-align:left;color:var(--text);font-weight:normal;
         transition:border-color .15s ease}
  .qcard.sel{border-color:var(--accent)}
  .qcard .qname{font-weight:600}
  .qcard .qnow{font-size:13px;margin-top:3px}
  .qcard .qwins{font-size:12px;color:var(--muted);margin-top:3px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
<script>
/* apply saved theme before first paint to avoid a flash on dark devices */
try{var t=localStorage.getItem("dtek_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>

<body>
<div class="wrap">
  <header>
    <div class="htop">
      <h1>&#9889; Odesa &middot; Shutdowns</h1>
      <div class="hbtns">
        <button class="iconbtn" id="btnRefresh" onclick="doRefresh()" title="Refresh" aria-label="Refresh">&#8635;</button>
        <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="Dark / light mode" aria-label="Toggle dark mode">&#127769;</button>
      </div>
    </div>
    <div class="hmeta">
      <button class="queuebtn" id="queueBtn" onclick="openSetup(false)" title="Change your queue (чергу)">Queue &#9662;</button>
      <span class="sub" id="updated"></span>
    </div>
  </header>

  <div id="banners"></div>

  <div class="card" id="setupCard" style="display:none"></div>

  <div class="card">
    <div class="state" id="state">&hellip;</div>
    <div class="nextsw" id="stateSub"></div>
    <div class="cd" id="countdown"></div>
    <div class="cdlabel" id="cdLabel"></div>

    <div class="hr"></div>

    <h2>Today <span class="src" id="todaySrc"></span></h2>
    <div class="barwrap">
      <div class="bar" id="bar"></div>
      <div class="ruler" id="ruler"></div>
    </div>
    <ul class="wins" id="winList"></ul>
    <div class="totals" id="totals"></div>
  </div>

  <footer>Data: community mirror of the official DTEK Odesa schedule
    (<a href="https://github.com/Baskerville42/outage-data-ua" target="_blank" rel="noreferrer">outage-data-ua</a>)
    &middot; refreshes ~every 15&nbsp;min &middot; Kyiv time &middot; unofficial</footer>
</div>

<script>
"use strict";

/* ---------------- config ---------------- */

const MIRROR_URLS = [
  "https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data/odesa.json",
  "https://cdn.jsdelivr.net/gh/Baskerville42/outage-data-ua@main/data/odesa.json"
];
const LS_SETTINGS = "dtek-odesa-web";
const LS_DATA = "dtek-odesa-web-data";
const TZ = "Europe/Kyiv";
const REFRESH_MS = 10 * 60 * 1000;
const STALE_MS = 12 * 60 * 60 * 1000;
const COL = { on: "#16a34a", off: "#dc2626", maybe: "#d97706", unknown: "#c3ccd9" };

/* ---------------- state ---------------- */

let DATA = null, DATA_TS = 0, FETCH_ERROR = null, SELECTED_QUEUE = null, SLOT_TABLE = [];
let HERO_STATE = null;

function settings() {
  try { return { group: (JSON.parse(localStorage.getItem(LS_SETTINGS) || "{}").group) || "" }; }
  catch (e) { return { group: "" }; }
}
function saveSettings(s) { localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }

/* ---------------- theme: follows system, manual toggle overrides ---------------- */
function applyTheme() {
  const saved = localStorage.getItem("dtek_theme");   // "light" | "dark" | null = follow system
  const sysDark = window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches;
  const dark = saved === "dark" || (saved === null && sysDark);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#000000" : "#f2f2f7");
  const b = document.getElementById("themeBtn");
  if (b) b.textContent = dark ? "\u2600\uFE0F" : "\uD83C\uDF19";   // sun / moon
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
  localStorage.setItem("dtek_theme", cur === "dark" ? "light" : "dark");
  applyTheme();
}

/* ---------------- Kyiv time ---------------- */

const WD_MAP = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
const kyivFmt = new Intl.DateTimeFormat("en-GB", {
  timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23", weekday: "short"
});
function kyivParts(date) {
  const o = {};
  kyivFmt.formatToParts(date).forEach(p => { o[p.type] = p.value; });
  return { y: +o.year, m: +o.month, d: +o.day, hh: +o.hour, mm: +o.minute,
           wd: WD_MAP[o.weekday] || 0, date: o.year + "-" + o.month + "-" + o.day };
}
function nowKyiv() { return kyivParts(new Date()); }
function dateInDays(i) { return kyivParts(new Date(Date.now() + i * 86400000)); }

/* ---------------- schedule parsing ---------------- */

function slotTable(timeZone) {
  const arr = [];
  for (const [k, v] of Object.entries(timeZone || {})) {
    const label = Array.isArray(v) ? String(v[0]) : String(v);
    const start = Array.isArray(v) && v.length > 1 ? String(v[1]) : label;
    const m = /^(\d{1,2}):(\d{2})$/.exec(start);
    arr.push({ key: String(k), label, start, startMin: m ? (+m[1]) * 60 + (+m[2]) : null });
  }
  arr.sort((a, b) => (a.startMin ?? 9999) - (b.startMin ?? 9999));
  return arr;
}
function daySlots(raw, table) {
  if (!raw) return [];
  return table.map(t => ({ ...t, status: String(raw[t.key] ?? "") }))
              .filter(s => s.status !== "");
}
function halfState(status, second) {
  switch (status) {
    case "yes": return "on";
    case "no": return "off";
    case "maybe": return "maybe";
    case "first": return second ? "on" : "off";
    case "second": return second ? "off" : "on";
    case "mfirst": return second ? "on" : "maybe";
    case "msecond": return second ? "maybe" : "on";
    default: return "maybe";
  }
}
function fmtMin(min) {
  return String(Math.floor((min % 1440) / 60)).padStart(2, "0") + ":" +
         String(min % 60).padStart(2, "0");
}
function fmtEnd(min) { return min >= 1440 ? "24:00" : fmtMin(min); }
function fmtDur(min) {
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return h + " h " + m + " min";
  if (h) return h + " h";
  return m + " min";
}

/* half-hour segments covering the whole day (gaps -> unknown) */
function segments(slots) {
  const segs = [];
  let cursor = null;
  for (const s of slots) {
    if (s.startMin === null) continue;
    if (cursor !== null && s.startMin > cursor)
      segs.push({ state: "unknown", from: cursor, to: s.startMin });
    if (cursor === null && s.startMin > 0)
      segs.push({ state: "unknown", from: 0, to: s.startMin });
    for (const half of [false, true]) {
      const st = halfState(s.status, half);
      const from = s.startMin + (half ? 30 : 0), to = from + 30;
      const last = segs[segs.length - 1];
      if (last && last.state === st && last.to === from) last.to = to;
      else segs.push({ state: st, from, to });
    }
    cursor = s.startMin + 60;
  }
  if (cursor !== null && cursor < 1440)
    segs.push({ state: "unknown", from: cursor, to: 1440 });
  return segs;
}

function currentState(slots, nowMin) {
  let cur = null;
  for (const s of slots) {
    if (s.startMin === null) continue;
    if (s.startMin <= nowMin) cur = s; else break;
  }
  if (!cur) return { state: "maybe", slot: null };
  return { state: halfState(cur.status, (nowMin - cur.startMin) >= 30), slot: cur };
}

function nextEvent(todaySlots, tomorrowSlots, nowMin) {
  let state = currentState(todaySlots, nowMin).state;
  const seq = [];
  for (const s of todaySlots) {
    if (s.startMin === null) continue;
    seq.push({ min: s.startMin, status: s.status, planned: false });
    seq.push({ min: s.startMin + 30, status: s.status, planned: false });
  }
  for (const s of (tomorrowSlots || [])) {
    if (s.startMin === null) continue;
    seq.push({ min: s.startMin + 1440, status: s.status, planned: true });
    seq.push({ min: s.startMin + 1470, status: s.status, planned: true });
  }
  seq.sort((a, b) => a.min - b.min);
  for (const h of seq) {
    const st = halfState(h.status, (h.min % 60) >= 30);
    if (h.min <= nowMin) { state = st; continue; }
    if (st !== state && (st === "on" || st === "off")) {
      return { min: h.min, at: fmtMin(h.min), state: st, planned: h.planned };
    }
    state = st;
  }
  return null;
}

/* ---------------- mirror data access ---------------- */

function factDay(data, parts) {
  const days = (data.fact && data.fact.data) || {};
  for (const [ts, groups] of Object.entries(days)) {
    const p = kyivParts(new Date(+ts * 1000));
    if (p.date === parts.date) return groups || null;
  }
  return null;
}
function presetDay(data, parts) {
  const groups = (data.preset && data.preset.data) || {};
  const day = {};
  for (const [g, days] of Object.entries(groups))
    if (days && days[String(parts.wd)]) day[g] = days[String(parts.wd)];
  return Object.keys(day).length ? day : null;
}
function queueDay(data, group, parts) {
  const fact = factDay(data, parts);
  if (fact && fact[group]) return { slots: daySlots(fact[group], SLOT_TABLE), source: "fact" };
  const preset = presetDay(data, parts);
  if (preset && preset[group]) return { slots: daySlots(preset[group], SLOT_TABLE), source: "preset" };
  return { slots: [], source: "none" };
}

/* ---------------- rendering ---------------- */

function el(id) { return document.getElementById(id); }
function banner(html, cls) {
  const d = document.createElement("div");
  d.className = "banner " + cls;
  d.innerHTML = html;
  el("banners").appendChild(d);
}

/* DTEK's "Шановні клієнти!" window from the mirror — emergency notices
   (air raid alerts, grid emergencies) during which schedules may not apply.
   Rendered as plain text (no HTML from the feed), line breaks preserved. */
function attentionBanner(raw) {
  const text = String(raw).replace(/[\u200b\u200c\u200d\ufeff]/g, "").trim();
  if (!text) return;
  const d = document.createElement("div");
  d.className = "banner attn";
  const t = document.createElement("div");
  t.innerHTML = "<b>\u26A0\uFE0F DTEK announcement \u2014 schedules may not apply:</b>";
  const body = document.createElement("div");
  body.className = "attn-body";
  body.textContent = text;
  d.appendChild(t);
  d.appendChild(body);
  el("banners").appendChild(d);
}

function render() {
  const s = settings();
  el("banners").innerHTML = "";
  const qb = el("queueBtn");

  if (!DATA) {
    el("state").className = "state unknown";
    el("state").textContent = FETCH_ERROR ? "NO DATA" : "LOADING\u2026";
    el("stateSub").textContent = "";
    el("countdown").textContent = "";
    el("cdLabel").textContent = "";
    el("bar").innerHTML = ""; el("ruler").innerHTML = "";
    el("winList").innerHTML = ""; el("totals").textContent = "";
    qb.textContent = "Queue \u25BE";
    if (FETCH_ERROR) banner("<b>Could not load the schedule.</b> " + FETCH_ERROR, "err");
    return;
  }

  if (DATA.attention && DATA.attention.text)
    attentionBanner(DATA.attention.text);
  if (FETCH_ERROR && DATA)
    banner("Could not refresh — showing data saved at " +
      new Date(DATA_TS).toLocaleString([], { dateStyle: "short", timeStyle: "short" }) + ".", "warn");
  if (DATA_TS && (Date.now() - DATA_TS > STALE_MS))
    banner("Showing data from " + new Date(DATA_TS).toLocaleString() + " — could not refresh recently.", "warn");
  const lus = DATA.lastUpdateStatus;
  if (lus && lus.ok === false)
    banner("<b>Mirror warning:</b> " + (lus.message || "upstream update may have failed") +
           " — data can be outdated.", "warn");

  const now = nowKyiv(), nowMin = now.hh * 60 + now.mm;
  const group = s.group;
  const schNames = (DATA.preset && DATA.preset.sch_names) || {};

  if (!group || !schNames[group]) {
    el("state").className = "state unknown";
    el("state").textContent = "PICK YOUR QUEUE";
    el("stateSub").textContent = "one-time setup below";
    el("countdown").textContent = "";
    el("cdLabel").textContent = "";
    qb.textContent = "Pick your queue \u25BE";
    if (group) banner("Saved queue <b>" + group + "</b> is not in today's data — pick your queue again.", "warn");
    openSetup(true);
    return;
  }

  const today = queueDay(DATA, group, now);
  const tomorrow = queueDay(DATA, group, dateInDays(1));
  const segs = segments(today.slots);
  const cur = currentState(today.slots, nowMin);
  const next = nextEvent(today.slots, tomorrow.slots, nowMin);

  const stateNames = { on: "POWER ON", off: "POWER OFF", maybe: "POSSIBLE OUTAGE" };
  const stEl = el("state");
  stEl.className = "state " + cur.state;
  stEl.textContent = stateNames[cur.state] || "\u2014";

  let sub = "";
  if (next) {
    if (next.state === "off") {
      const w = segs.find(g => g.state === "off" && g.from <= next.min && next.min < g.to);
      sub = "Power off at " + next.at + (w ? " \u00b7 back on at " + fmtEnd(w.to) : "");
    } else {
      sub = "Power back on at " + next.at;
    }
    if (next.planned) sub += " (planned)";
  } else if (today.slots.length) {
    sub = "No further switches today";
  } else {
    sub = "Schedule not published for today";
  }
  el("stateSub").textContent = sub;
  updateCountdown(cur, next, nowMin);
  qb.textContent = (schNames[group] || group) + " \u25BE";

  el("todaySrc").textContent = today.source === "fact" ? "\u2014 confirmed schedule" :
    (today.source === "preset" ? "\u2014 planned weekly schedule" : "");

  /* --- timeline bar: proportional on/off blocks --- */
  const bar = el("bar"); bar.innerHTML = "";
  segs.forEach(g => {
    const d = document.createElement("div");
    d.className = "seg";
    d.style.width = ((g.to - g.from) / 1440 * 100) + "%";
    d.style.background = COL[g.state] || COL.unknown;
    d.title = fmtMin(g.from) + " \u2013 " + fmtEnd(g.to) + " \u00b7 " +
      (g.state === "on" ? "power on" : g.state === "off" ? "power off" :
       g.state === "maybe" ? "possible outage" : "no data");
    if (g.to - g.from >= 120) {
      const sp = document.createElement("span");
      sp.textContent = g.state === "off" ? "OFF" : g.state === "maybe" ? "MAYBE" : "ON";
      d.appendChild(sp);
    }
    bar.appendChild(d);
  });

  /* 30-minute grid separators: stronger line each full hour, lighter each half */
  const grid = document.createElement("div");
  grid.className = "grid";
  for (let m = 30; m < 1440; m += 30) {
    const g = document.createElement("div");
    g.className = "gline" + (m % 60 === 0 ? "" : " half");
    g.style.left = (m / 1440 * 100) + "%";
    grid.appendChild(g);
  }
  bar.appendChild(grid);

  const ruler = el("ruler"); ruler.innerHTML = "";
  for (let m = 0; m <= 1440; m += 360) {
    const t = document.createElement("div");
    t.className = "tick";
    t.style.left = (m / 1440 * 100) + "%";
    t.textContent = (m === 1440) ? "24:00" : fmtMin(m);
    ruler.appendChild(t);
  }

  /* now marker */
  document.querySelectorAll(".nowline, .nowlabel").forEach(n => n.remove());
  const bw = document.querySelector(".barwrap");
  const pct = Math.min(100, Math.max(0, nowMin / 1440 * 100));
  const line = document.createElement("div");
  line.className = "nowline"; line.style.left = "calc(" + pct + "% - 1px)";
  line.title = "now";
  const lab = document.createElement("div");
  lab.className = "nowlabel"; lab.style.left = pct + "%";
  lab.textContent = "now " + fmtMin(nowMin);
  bw.appendChild(line); bw.appendChild(lab);

  /* --- windows list --- */
  const wl = el("winList"); wl.innerHTML = "";
  const offs = segs.filter(g => g.state === "off");
  const maybes = segs.filter(g => g.state === "maybe");
  const addWin = (g, label, color) => {
    const li = document.createElement("li");
    li.innerHTML = '<span class="mark" style="background:' + color + '">' + label + '</span>' +
      '<span class="t">' + fmtMin(g.from) + " \u2013 " + fmtEnd(g.to) + "</span>" +
      '<span class="dur">' + fmtDur(g.to - g.from) + "</span>";
    wl.appendChild(li);
  };
  offs.forEach(g => addWin(g, "OFF", COL.off));
  maybes.forEach(g => addWin(g, "MAYBE", COL.maybe));
  if (!offs.length && !maybes.length)
    wl.innerHTML = '<li class="muted" style="border-bottom:0">No shutdowns scheduled for today \uD83C\uDF89</li>';

  const totOff = offs.reduce((a, g) => a + g.to - g.from, 0);
  const totMaybe = maybes.reduce((a, g) => a + g.to - g.from, 0);
  let totals = totOff ? "Planned without power today: <b>" + fmtDur(totOff) + "</b>" : "";
  if (totMaybe) totals += (totals ? " \u00b7 " : "") + "possible outages: <b>" + fmtDur(totMaybe) + "</b>";
  el("totals").innerHTML = totals;

  const upd = (DATA.fact && DATA.fact.update) || "";
  el("updated").textContent = upd ? "DTEK update: " + upd : "";
  el("updated").title = "Mirror lastUpdated: " + (DATA.lastUpdated || "?");
}

/* ---------------- countdown ---------------- */

/* live "time until" hero number: updates every 30 s between full renders;
   if the power state flipped since the last paint, re-render everything */
function updateCountdown(cur, next, nowMin) {
  HERO_STATE = cur.state;
  const cdEl = el("countdown"), labEl = el("cdLabel");
  if (!next) { cdEl.textContent = ""; labEl.textContent = ""; cdEl.className = "cd"; return; }
  const mins = Math.max(0, next.min - nowMin);
  cdEl.textContent = fmtDur(mins);
  labEl.textContent = next.state === "off" ? "until power goes off" : "until power is back on";
  cdEl.className = "cd" + (next.state === "off" && mins <= 30 ? " urgent" : "");
}

function tickCountdown() {
  if (!DATA || !SLOT_TABLE.length) return;
  const group = settings().group;
  if (!group || !((DATA.preset && DATA.preset.sch_names) || {})[group]) return;
  const now = nowKyiv(), nowMin = now.hh * 60 + now.mm;
  const today = queueDay(DATA, group, now);
  if (!today.slots.length) return;
  const cur = currentState(today.slots, nowMin);
  if (cur.state !== HERO_STATE) { render(); return; }
  const tomorrow = queueDay(DATA, group, dateInDays(1));
  const next = nextEvent(today.slots, tomorrow.slots, nowMin);
  updateCountdown(cur, next, nowMin);
}

/* ---------------- one-time setup ---------------- */

function openSetup(keepBanners) {
  if (!keepBanners) el("banners").innerHTML = "";
  const card = el("setupCard");
  card.style.display = "";
  const now = nowKyiv(), nowMin = now.hh * 60 + now.mm;
  const schNames = (DATA && DATA.preset && DATA.preset.sch_names) || {};
  const names = Object.keys(schNames).length ? Object.entries(schNames) : [["GPV1.1", "\u0427\u0435\u0440\u0433\u0430 1.1"]];

  let html = "<h2 class='h2big'>Pick your outage queue (\u0447\u0435\u0440\u0433\u0443)</h2>" +
    "<div class='small'>Find yours at <a href='https://www.dtek-oem.com.ua/ua/shutdowns' target='_blank' rel='noreferrer'>dtek-oem.com.ua/ua/shutdowns</a> " +
    "\u2014 enter your address once and it shows <b>\u0427\u0435\u0440\u0433\u0430 X.X</b>. " +
    "Saved in this browser \u2014 that's the last time you need the DTEK site.</div>" +
    "<div class='small muted' style='margin-top:4px'>Each card shows that queue's shutdowns today \u2014 " +
    "match yours by when the power goes off.</div>" +
    "<div class='qgrid'>";
  for (const [g, name] of names) {
    const qd = DATA ? queueDay(DATA, g, now) : { slots: [] };
    const st = currentState(qd.slots, nowMin).state;
    const wins = segments(qd.slots).filter(x => x.state === "off")
      .map(x => fmtMin(x.from) + "\u2013" + fmtEnd(x.to)).join(", ");
    html += "<div class='qcard" + (SELECTED_QUEUE === g ? " sel" : "") + "' data-g='" + g + "'>" +
      "<div class='qname'>" + name + "</div>" +
      "<div class='qnow'><span class='dot' style='background:" + (COL[st] || COL.maybe) + "'></span>" +
      (st === "on" ? "on now" : st === "off" ? "off now" : "possible outage") + "</div>" +
      "<div class='qwins'>" + (wins ? "off: " + wins : (qd.slots.length ? "no outages today" : "no data")) + "</div>" +
      "</div>";
  }
  html += "</div><div class='row' style='margin-top:14px'>" +
    "<button id='btnSaveQueue'" + (SELECTED_QUEUE ? "" : " disabled") + ">Save \u2014 this is my queue</button>" +
    "<button class='secondary' onclick='closeSetup()'>Cancel</button></div>";
  card.innerHTML = html;

  card.querySelectorAll(".qcard").forEach(c => c.addEventListener("click", () => {
    SELECTED_QUEUE = c.dataset.g;
    card.querySelectorAll(".qcard").forEach(x => x.classList.remove("sel"));
    c.classList.add("sel");
    el("btnSaveQueue").disabled = false;
  }));
  el("btnSaveQueue").addEventListener("click", () => {
    const s2 = settings();
    s2.group = SELECTED_QUEUE;
    saveSettings(s2);
    closeSetup();
    render();
  });
}
function closeSetup() { el("setupCard").style.display = "none"; }

/* ---------------- data loading ---------------- */

async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function loadData() {
  let lastErr = null;
  for (const url of MIRROR_URLS) {
    try {
      const data = await fetchWithTimeout(url, 15000);
      if (!data || !data.preset) throw new Error("unexpected data format");
      DATA = data; DATA_TS = Date.now(); FETCH_ERROR = null;
      try { localStorage.setItem(LS_DATA, JSON.stringify({ ts: DATA_TS, data })); } catch (e) {}
      return;
    } catch (err) { lastErr = err.message || String(err); }
  }
  FETCH_ERROR = "Could not reach the data mirror (" + lastErr + "). " +
    "Check your internet connection; showing cached data if available.";
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(LS_DATA) || "null");
    if (c && c.data && c.data.preset) { DATA = c.data; DATA_TS = c.ts; }
  } catch (e) {}
}
async function doRefresh() {
  const btn = el("btnRefresh");
  btn.disabled = true;
  await loadData();
  render();
  btn.disabled = false;
}

/* ---------------- init ---------------- */

(async function init() {
  applyTheme();
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", () => {
      if (!localStorage.getItem("dtek_theme")) applyTheme();
    });
  }
  loadCache();
  SELECTED_QUEUE = settings().group;
  if (DATA) { SLOT_TABLE = slotTable(DATA.preset.time_zone); render(); }
  else render();
  await loadData();
  if (DATA) SLOT_TABLE = slotTable(DATA.preset.time_zone);
  render();
  setInterval(() => { if (!document.hidden) doRefresh(); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden) tickCountdown(); }, 30000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - DATA_TS > REFRESH_MS) doRefresh();
    else if (!document.hidden) tickCountdown();
  });
  // installable app: register service worker (skipped when opened as file://)
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
